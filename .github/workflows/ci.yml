name: Desktop checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install Corepack
        run: npm install --global corepack@0.31.0 --force
      - name: Restore web dependencies
        working-directory: ExcalidrawDesktop.Web
        run: corepack yarn install --frozen-lockfile
      - name: Check TypeScript
        working-directory: ExcalidrawDesktop.Web
        run: corepack yarn typecheck
      - name: Test web code
        working-directory: ExcalidrawDesktop.Web
        run: corepack yarn test
      - name: Test core code
        run: dotnet test ExcalidrawDesktop.Core.Tests/ExcalidrawDesktop.Core.Tests.csproj --configuration Release
      - name: Test Windows file transactions
        run: dotnet test ExcalidrawDesktop.Native.Tests/ExcalidrawDesktop.Native.Tests.csproj --configuration Release
      - name: Check localization
        run: ./tools/Test-Localization.ps1
      - name: Build web assets
        run: ./tools/Build-WebAssets.ps1
      - name: Build Debug desktop app
        run: dotnet build ExcalidrawDesktop.App/ExcalidrawDesktop.App.csproj --configuration Debug -p:Platform=x64 -warnaserror
      - name: Build Release desktop app
        run: dotnet build ExcalidrawDesktop.App/ExcalidrawDesktop.App.csproj --configuration Release -p:Platform=x64 -warnaserror
